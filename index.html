<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
 <body>
   <header class="header">
      <div class="container">
        <a class="header__logo" href="#">
          <img src="./img/GathSession..svg" alt="">
        </a>

        <nav class="header__nav">
          <ul class="header__menu">
            <li class="header__item"><a href="#">Home</a></li>
            <li class="header__item"><a href="#">Features</a></li>
            <li class="header__item"><a href="#">Blog</a></li>
            <li class="header__item"><a href="#">Contact</a></li>
            <li class="header__item"><a href="#">About Us</a></li>
          </ul>
        </nav>    
      </div>
    </header>

  <main class="main">  
    <div class="container">
      <div class="hero__format">
        <div class="left">
          <section class="hero">
            <h1 class="hero__title">
              Build your best community starting from here.
            </h1>
            <p class="hero__subtitle">
              Meet and communicate with the best people to run projects, events or other activities in a more effective and fun way
            </p>
            <a href="#" class="hero__button--1">Get started</a>
            <a href="#" class="hero__button--2">Learn More <img src="./img/Arrow.svg" alt=""></a>
          </section>

          <section class="services">
            <article class="services__item">
              <div class="services__icon">              
                <img src="./img/comments.svg" alt="">
              </div>
              <p class="services__content">
                Build Community
              </p>
            </article>

            <article class="services__item">
              <div class="services__icon">
                <img src="./img/calendar.png" alt="">
              </div>
              <p class="services__content">
                Share Events
              </p>
            </article>

            <article class="services__item">
              <div class="services__icon">
                <img src="./img/information.png" alt="">
              </div>
              <p class="services__content">
                Get Information
              </p>
            </article>
          </section>
        </div>    

        <div class="right">
          <section class="mosaic">
            <div class="mosaic__design--1">
              <div class="mosaic__pic mosaic__purple"> 
                <img src="./img/blackguy_purple.svg" alt=""> 
              </div> 
              <div class="mosaic__pic mosaic__pink"> 
                <img src="./img/redhair.svg" alt=""> 
              </div>
            </div>

            <div class="mosaic__design--2">
              <div class="mosaic__pic mosaic__cyan"> 
                <img src="./img/asian_blue.svg" alt=""> 
              </div> 
              <div class="mosaic__pic mosaic__orange"> 
                <img src="./img/whiteguy_orange.svg" alt=""> 
              </div> 
            </div>

            <div class="mosaic__pic mosaic__yellow mosaic__design--3"> 
              <img src="./img/blacklady_yellow.svg" alt=""> 
            </div> 
          </section>
        </div>
      </div>
    </div>
  </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
